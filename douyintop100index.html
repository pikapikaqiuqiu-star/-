// Sort by plays initially
DATA.sort((a,b)=>b.plays-a.plays);
// Add rank
DATA.forEach((d,i)=>d.rank=i+1);

function fmt(n){
  if(!n)return'0';
  if(n>=100000000)return(n/100000000).toFixed(1)+'亿';
  if(n>=10000000)return(n/10000000).toFixed(1)+'千万';
  if(n>=10000)return(n/10000).toFixed(1)+'万';
  return n.toLocaleString();
}

function sentClass(s){
  if(s==='正面')return'sent-pos';
  if(s==='负面')return'sent-neg';
  return'sent-neu';
}

const COLORS=['#1a6b3c','#4a1d96','#7c2d12','#1e3a5f','#374151','#065f46','#7f1d1d','#1e40af','#713f12','#4c1d95'];
function colorFor(i){return COLORS[i%COLORS.length];}

let activeVideo=null;

function playVideo(card,url,idx){
  if(!url)return;
  if(activeVideo&&activeVideo!==card){
    const prev=activeVideo.querySelector('video');
    if(prev)prev.pause();
    activeVideo.querySelector('.thumb').innerHTML=activeVideo._origThumb;
    activeVideo.classList.remove('playing');
  }
  if(card.classList.contains('playing')){
    const v=card.querySelector('video');
    if(v)v.pause();
    card.querySelector('.thumb').innerHTML=card._origThumb;
    card.classList.remove('playing');
    activeVideo=null;
    return;
  }
  const thumb=card.querySelector('.thumb');
  const badges=thumb.innerHTML;
  card._origThumb=badges;
  thumb.innerHTML=`<video src="${url}" autoplay controls playsinline style="width:100%;height:100%;object-fit:cover;display:block;"></video>${badges}`;
  card.classList.add('playing');
  activeVideo=card;
}

function render(){
  const sf=document.getElementById('sent-filter').value;
  const ss=document.getElementById('sort-select').value;
  const kw=document.getElementById('kw-input').value.trim().toLowerCase();

  let data=[...DATA];
  if(sf)data=data.filter(d=>d.sentiment===sf);
  if(kw)data=data.filter(d=>d.title.toLowerCase().includes(kw)||d.author.toLowerCase().includes(kw));
  data.sort((a,b)=>b[ss]-a[ss]);

  document.getElementById('count-info').textContent=`显示 ${data.length} 条，按${{plays:'播放量',interact:'互动量',likes:'点赞数',comments:'评论数',collects:'收藏数',shares:'转发数'}[ss]}降序排列`;

  const statsBar=document.getElementById('stats-bar');
  const totalPlays=data.reduce((s,d)=>s+d.plays,0);
  const totalInteract=data.reduce((s,d)=>s+d.interact,0);
  statsBar.innerHTML=`
    <div class="stat-chip">共 <strong>${data.length}</strong> 条视频</div>
    <div class="stat-chip">总播放量 <strong>${fmt(totalPlays)}</strong></div>
    <div class="stat-chip">总互动量 <strong>${fmt(totalInteract)}</strong></div>
    <div class="stat-chip">正面 <strong style="color:#52c41a">${data.filter(d=>d.sentiment==='正面').length}</strong> 条</div>
    <div class="stat-chip">负面 <strong style="color:#ff4d4f">${data.filter(d=>d.sentiment==='负面').length}</strong> 条</div>
  `;

  const g=document.getElementById('grid');
  if(data.length===0){g.innerHTML='<div class="empty">没有匹配的内容，试试其他筛选条件</div>';return;}

  g.innerHTML=data.map((d,i)=>{
    const rank=i+1;
    const rankClass=rank<=3?'top3':'';
    const bg=colorFor(rank-1);
    const initials=d.author.slice(0,2);
    const thumbHtml=`
      <div class="rank-badge ${rankClass}">${rank<=3?['🥇','🥈','🥉'][rank-1]:'#'+rank}</div>
      <span class="sent-badge ${sentClass(d.sentiment)}">${d.sentiment}</span>
      <div class="thumb-placeholder" style="background:${bg}22;">
        <div style="width:48px;height:48px;border-radius:50%;background:${bg};display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:600;">${initials}</div>
      </div>
      ${d.url?`<div class="play-btn"><svg viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg></div>`:''}
    `;
    return`<div class="card" data-idx="${i}" data-url="${d.url||''}">
      <div class="thumb" style="cursor:${d.url?'pointer':'default'};">${thumbHtml}</div>
      <div class="card-body">
        <p class="card-title">${d.title}</p>
        <p class="card-author">${d.author}</p>
        <div class="metrics">
          <div class="metric"><span class="metric-label">播放量</span><span class="metric-value highlight">${fmt(d.plays)}</span></div>
          <div class="metric"><span class="metric-label">互动量</span><span class="metric-value">${fmt(d.interact)}</span></div>
          <div class="metric"><span class="metric-label">点赞</span><span class="metric-value">${fmt(d.likes)}</span></div>
          <div class="metric"><span class="metric-label">评论</span><span class="metric-value">${fmt(d.comments)}</span></div>
        </div>
        <div class="card-footer">
          ${d.url
            ?`<a class="watch-btn" href="${d.url}" target="_blank"><svg viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>查看视频</a>`
            :`<span class="no-link">暂无链接</span>`
          }
          <span style="font-size:11px;color:#bbb;">收藏 ${fmt(d.collects)}</span>
        </div>
      </div>
    </div>`;
  }).join('');

  g.querySelectorAll('.card').forEach((card,i)=>{
    const url=card.dataset.url;
    if(url){
      card.querySelector('.thumb').addEventListener('click',()=>playVideo(card,url,i));
    }
  });
}

render();
</script>
